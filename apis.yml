name: Thamarah Al-Jill Co LLC
description: >-
  Thamarah Al-Jill Co LLC operates AMUSED Co (amusedco.com), a Saudi Arabia-based online
  marketplace for authenticated, curated pre-loved luxury — designer handbags and women's
  clothing from houses such as Louis Vuitton, Hermes and Chanel at up to 70% off retail.
  Under a "Resell, Rebuy, Relove" model, buyers shop verified second-hand pieces (backed by
  a one-year authentication money-back guarantee) and sellers list their own unused items;
  payment options include credit card, Mada and Tamara. The store is a 500 Global portfolio
  company. It is built on Shopify and is fully agent-native: it publishes an /llms.txt agent
  guide and implements the Universal Commerce Protocol (UCP) over an MCP endpoint, with
  Shopify Customer Accounts OpenID Connect for buyer authentication.
