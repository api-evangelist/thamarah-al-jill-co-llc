summary: AMUSED Co exposes an agent-native commerce surface via the Universal Commerce Protocol (UCP,
  https://ucp.dev), served over MCP by the underlying Shopify platform. The store's /.well-known/ucp profile
  advertises a UCP "dev.ucp.shopping" service over MCP transport, plus an embedded transport. Checkout
  requires contemporaneous human buyer approval; the endpoint is rate-limited per IP (back off on HTTP
  429). Tool schemas are the UCP OpenRPC documents referenced in the profile.
server:
  name: amused-ucp-shopping
  protocol: Universal Commerce Protocol (UCP)
  transport: http
  url: https://amusedco.com/api/ucp/mcp
  staging_url: https://amused-staging.myshopify.com/api/ucp/mcp
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
capabilities:
- dev.ucp.shopping.catalog.search
